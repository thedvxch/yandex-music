  <!-- вордмарк + одна строка-описание -->
  <text x="356" y="146" font-size="28" font-weight="500" fill="#8a80ab" letter-spacing="0.5">@dvxch/</text>
  <text x="352" y="212" font-size="74" font-weight="800" fill="url(#wm)" letter-spacing="-2.5">yandex-music</text>
  <text x="356" y="252" font-size="22" font-weight="400" fill="#9a92ba" letter-spacing="0.2">Типизированный клиент API Яндекс Музыки на TypeScript</text>
